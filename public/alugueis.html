<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Aluguéis | Biblioteca SaaS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar"><a class="brand" href="dashboard.html">Saas Biblioteca<span>.</span></a>
            <nav class="nav"><a href="dashboard.html">Visão geral</a><a href="livros.html">Livros</a><a
                    href="usuarios.html">Usuários</a><a href="funcionarios.html">Funcionários</a><a
                    href="computadores.html">Computadores</a><a href="vendas.html">Vendas</a><a class="active"
                    href="alugueis.html">Aluguéis</a><a href="recepcao.html">Recepção</a><a
                    href="catraca.html">Catraca</a></nav>
            <div class="sidebar-footer">Unidade Central<br><button class="btn ghost" data-logout
                    style="margin-top:12px;color:#d7ed72;border-color:#52745c">Sair</button></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div>
                    <div class="eyebrow">Circulação</div>
                    <h1>Aluguéis</h1>
                    <p class="subtitle">Registre empréstimos e acompanhe datas de devolução.</p>
                </div>
            </header>
            <section class="grid content-grid">
                <div class="card">
                    <h2>Novo aluguel</h2>
                    <form id="loan-form" class="form">
                        <div class="field"><label for="book-title">Livro</label><input id="book-title" name="bookTitle"
                                required></div>
                        <div class="field"><label for="loan-user">Usuário</label><input id="loan-user" name="userName"
                                required></div>
                        <div class="field"><label for="due-date">Data de devolução</label><input id="due-date"
                                name="dueDate" type="date" required></div><button class="btn" type="submit">Registrar
                            aluguel</button>
                        <div id="loan-message" class="stat-note"></div>
                    </form>
                </div>
                <div class="card">
                    <h2>Empréstimos ativos</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Livro</th>
                                    <th>Usuário</th>
                                    <th>Devolução</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="data-rows"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/library.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/alugueis.js"></script>
</body>

</html>
