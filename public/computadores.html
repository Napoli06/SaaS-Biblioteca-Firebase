<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Computadores | Biblioteca SaaS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <aside class="sidebar"><a class="brand" href="dashboard.html">Saas Biblioteca<span>.</span></a>
            <nav class="nav"><a href="dashboard.html">Visão geral</a><a href="livros.html">Livros</a><a
                    href="usuarios.html">Usuários</a><a href="funcionarios.html">Funcionários</a><a class="active"
                    href="computadores.html">Computadores</a><a href="vendas.html">Vendas</a><a
                    href="alugueis.html">Aluguéis</a><a href="recepcao.html">Recepção</a><a
                    href="catraca.html">Catraca</a></nav>
            <div class="sidebar-footer">Unidade Central<br><button class="btn ghost" data-logout
                    style="margin-top:12px;color:#d7ed72;border-color:#52745c">Sair</button></div>
        </aside>
        <main class="main">
            <header class="topbar">
                <div>
                    <div class="eyebrow">Infraestrutura</div>
                    <h1>Computadores</h1>
                    <p class="subtitle">Controle reservas, sessões e horas de uso.</p>
                </div>
            </header>
            <section class="grid content-grid">
                <div class="card">
                    <h2>Agendar estação</h2>
                    <form id="computer-form" class="form">
                        <div class="field"><label for="user-name">Código do membro</label><input id="user-name"
                                name="userName" required placeholder="LEITOR-000123"></div>
                        <div class="field"><label for="computer-id">Computador</label><select id="computer-id"
                                name="computerId" required></select></div>
                        <div class="field"><label for="computer-date">Data de uso</label><input id="computer-date"
                                name="date" type="date" required></div>
                        <div class="field"><label for="start-time">Horário de início</label><input id="start-time"
                                name="startTime" type="time" required></div>
                        <div class="field"><label for="hours">Horas reservadas</label><input id="hours" name="hours"
                                type="number" min="1" max="8" step="1" required></div><button class="btn"
                            type="submit">Agendar computador</button>
                        <div id="computer-message" class="stat-note"></div>
                    </form>
                </div>
                <div class="card">
                    <h2>Estações</h2>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Estação</th>
                                    <th>Local</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="data-rows"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/library.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/computadores.js"></script>
</body>

</html>
